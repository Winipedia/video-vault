[project]
name = "video-vault"
version = "2.17.6"
description = "An application to download any video"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
dependencies = [
  "cryptography>=49.0.0",
  "django>=6.0.7",
  "imageio-ffmpeg>=0.6.0",
  "platformdirs>=4.10.0",
  "pyrig-runtime>=3.5.2",
  "pyside6>=6.11.1",
  "winidjango>=4.1.3",
  "winipyside>=4.1.3",
  "winiutils>=4.1.3",
  "yt-dlp>=2026.7.4",
]

[project.urls]
Changelog = "https://github.com/Winipedia/video-vault/releases"
Documentation = "https://Winipedia.github.io/video-vault"
Homepage = "https://github.com/Winipedia/video-vault"
Issues = "https://github.com/Winipedia/video-vault/issues"
Source = "https://github.com/Winipedia/video-vault"

[project.scripts]
video-vault = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "django-stubs>=6.0.6",
  "mkdocstrings[python]>=1.0.5",
  "pillow>=12.3.0",
  "pre-commit-hooks",
  "prek>=0.4.8",
  "pyinstaller>=6.21.0",
  "pyrig>=18.3.4",
  "pyrig-executables>=3.1.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.13.0",
  "pytest-mock>=3.15.1",
  "pytest-qt>=4.5.0",
  "pytest-randomly",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.21",
  "rumdl>=0.2.30",
  "ryl",
  "shellcheck-py",
  "shfmt-py",
  "tombi",
  "ty>=0.0.58",
  "types-defusedxml>=0.7.0.20260504",
  "types-tqdm>=4.68.0.20260608",
  "typos>=1.48.0",
  "yt-dlp-types>=0.0.18",
  "zensical>=0.0.52",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=50",
  "--cov-report=term-missing:skip-covered",
  "--cov=video_vault",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff]
exclude = [
  "**/migrations/*.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
