[project]
name = "video-vault"
version = "2.18.127"
description = "An application to download any video"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
dependencies = [
  "cryptography>=50.0.2",
  "django>=6.1.3",
  "imageio-ffmpeg>=0.8.2",
  "platformdirs>=4.14.9",
  "pyrig-runtime>=3.28.0",
  "pyside6>=6.12.0",
  "winidjango>=4.17.0",
  "winipyside>=4.16.0",
  "winiutils>=4.16.0",
  "yt-dlp>=2026.11.23",
]

[project.urls]
Changelog = "https://github.com/Winipedia/video-vault/releases"
Documentation = "https://Winipedia.github.io/video-vault"
Homepage = "https://github.com/Winipedia/video-vault"
Issues = "https://github.com/Winipedia/video-vault/issues"
Source = "https://github.com/Winipedia/video-vault"

[project.scripts]
video-vault = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "django-stubs>=6.1.2",
  "hypofuzz>=25.11.1",
  "hypothesis>=6.170.23",
  "mkdocstrings[python]>=1.0.8",
  "pillow>=13.0.0",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.12",
  "pyflakes>=4.1.0",
  "pyinstaller>=6.22.3",
  "pyorder>=1.1.0",
  "pyrig-codeql>=3.3.0",
  "pyrig-executables>=5.4.0",
  "pyrig-public>=1.6.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-mock>=3.17.0",
  "pytest-qt>=4.5.0",
  "pytest-randomly>=5.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.6",
  "rumdl>=0.3.8",
  "ryl>=0.30.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.11.3",
  "ty>=0.0.112",
  "types-defusedxml>=0.7.0.20260504",
  "types-tqdm>=4.70.0.20261122",
  "typos>=1.52.2",
  "vulture>=2.16",
  "yt-dlp-types>=0.0.18",
  "zensical>=0.1.4",
  "zizmor>=1.33.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=50",
  "--cov-report=term-missing:skip-covered",
  "--cov=video_vault",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff]
exclude = [
  "**/migrations/*.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.lint]
strict = true

[tool.ryl.lint.rules]
ALL = "enable"
key-ordering = "disable"
yaml-directive = "disable"

[tool.ty.rules]
all = "error"

[tool.typos.default]
extend-ignore-re = [
  "(?m)^.*spellchecker:disable-line.*$",
  "(?m)^.*spellchecker:disable-next-line.*\n.*",
]
locale = "en-us"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
