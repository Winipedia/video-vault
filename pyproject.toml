[project]
name = "video-vault"
version = "2.17.34"
description = "An application to download any video"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
dependencies = [
  "cryptography>=50.0.1",
  "django>=6.1.1",
  "imageio-ffmpeg>=0.6.0",
  "platformdirs>=4.11.12",
  "pyrig-runtime>=3.23.45",
  "pyside6>=6.11.2",
  "winidjango>=4.15.32",
  "winipyside>=4.14.75",
  "winiutils>=4.14.72",
  "yt-dlp>=2026.8.19",
]

[project.urls]
Changelog = "https://github.com/Winipedia/video-vault/releases"
Documentation = "https://Winipedia.github.io/video-vault"
Homepage = "https://github.com/Winipedia/video-vault"
Issues = "https://github.com/Winipedia/video-vault/issues"
Source = "https://github.com/Winipedia/video-vault"

[project.scripts]
video-vault = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "django-stubs>=6.1.1",
  "mkdocstrings[python]>=1.0.6",
  "pillow>=12.3.0",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.3",
  "pyflakes>=3.4.0",
  "pyinstaller>=6.22.3",
  "pyrig>=18.85.1",
  "pyrig-codeql>=1.0.0",
  "pyrig-executables>=3.18.24",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-mock>=3.15.1",
  "pytest-qt>=4.5.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.8",
  "rumdl>=0.2.75",
  "ryl>=0.22.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.5.5",
  "ty>=0.0.83",
  "types-defusedxml>=0.7.0.20260504",
  "types-tqdm>=4.70.0.20260906",
  "typos>=1.50.2",
  "yt-dlp-types>=0.0.18",
  "zensical>=0.0.64",
  "zizmor>=1.30.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=50",
  "--cov-report=term-missing:skip-covered",
  "--cov=video_vault",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff]
exclude = [
  "**/migrations/*.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
