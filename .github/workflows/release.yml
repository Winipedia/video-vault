---
"name": "Release"
"on":
  "push":
    "branches":
      - "main"
"permissions": {}
"concurrency":
  "group": "Release-${{ github.ref }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"env":
  "PYTHONDONTWRITEBYTECODE": 1
  "UV_NO_SYNC": 1
"run-name": "Release"
"jobs":
  "executable":
    "name": "Executable"
    "permissions":
      "contents": "read"
    "runs-on": "${{ matrix.os }}"
    "strategy":
      "matrix":
        "os":
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
      "fail-fast": true
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4"  # v10.1.0
        "with":
          "python-version": "3.13"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Install Pyside System Dependencies"
        "id": "install-pyside-system-dependencies"
        "if": "runner.os == 'Linux'"
        "run": |-
          sudo \
          apt-get \
          update \
          && \
          sudo \
          apt-get \
          install \
          -y \
          libegl1 \
          libpulse0
      -
        "name": "Build Executable"
        "id": "build-executable"
        "run": |-
          uv \
          run \
          pyinstaller \
          --onefile \
          --name=video-vault-"${OS}" \
          --icon=src/video_vault/rig/resources/icon.png \
          --collect-all=video_vault.core.db.migrations \
          --collect-data=video_vault.rig.resources \
          --collect-data=winipyside.rig.resources \
          src/video_vault/main.py
        "env":
          "OS": "${{ runner.os }}"
      -
        "name": "Upload Executable"
        "id": "upload-executable"
        "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        "with":
          "name": "executable-${{ runner.os }}"
          "path": "dist"
  "health-check":
    "name": "Health Check"
    "permissions":
      "actions": "read"  # required
      "contents": "read"
      "security-events": "write"  # required
    "uses": "$/.github/workflows/health_check.yml"
  "publish":
    "name": "Publish"
    "permissions":
      "contents": "write"  # required
    "needs":
      - "health-check"
      - "executable"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4"  # v10.1.0
        "with":
          "python-version": "3.13"
      -
        "name": "Extract Version"
        "id": "extract-version"
        "run": |-
          VERSION="$(uv version --short)"
          echo version="${VERSION}" >> "${GITHUB_OUTPUT}"
      -
        "name": "Download Executables"
        "id": "download-executables"
        "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
        "with":
          "pattern": "executable-*"
          "path": "dist"
          "merge-multiple": "true"
      -
        "name": "Create Release"
        "id": "create-release"
        "run": |-
          gh \
          release \
          create \
          "${VERSION}" \
          dist/* \
          --title="${VERSION}" \
          --generate-notes
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          "VERSION": "${{ steps.extract-version.outputs.version }}"
  "deploy":
    "name": "Deploy"
    "permissions":
      "contents": "read"
      "id-token": "write"  # required
      "pages": "write"  # required
    "needs":
      - "publish"
    "uses": "$/.github/workflows/deploy.yml"
    "secrets":
      "REPO_TOKEN": "${{ secrets.REPO_TOKEN }}"
...
